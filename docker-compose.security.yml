# =============================================================================
#  OVERLAY BẢO MẬT (nâng cao) – chồng lên docker-compose.yml
#   1. Reverse proxy Caddy: HTTPS (chứng chỉ nội bộ "tls internal"), redirect .well-known
#   2. Giới hạn tài nguyên (RAM / CPU / số tiến trình) cho từng container
#   3. no-new-privileges cho mọi container
#   4. Redis & Caddy: filesystem chỉ-đọc + bỏ toàn bộ Linux capabilities (trừ tối thiểu)
#  Bật bằng: COMPOSE_FILE=docker-compose.yml:docker-compose.security.yml (trong .env)
#  Nhớ đặt NC_BIND_IP=127.0.0.1 để cổng HTTP 8080 không còn mở ra ngoài.
# =============================================================================
services:
  caddy:
    image: caddy:2-alpine
    container_name: nc_caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      NC_DOMAIN: ${NC_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # BIND MOUNT chỉ-đọc
      - caddy_data:/data                            # chứa CA nội bộ + chứng chỉ
      - caddy_config:/config
    networks:
      - frontend
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE                            # cần để lắng nghe cổng 80/443
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    environment:
      # Phía sau proxy HTTPS: Nextcloud phải tạo URL dạng https://
      OVERWRITEPROTOCOL: https
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  cron:
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  db:
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

  redis:
    read_only: true
    tmpfs:
      - /data                                       # redis cần thư mục ghi tạm, để trong RAM
    cap_drop:
      - ALL
    cap_add:                                        # tối thiểu để entrypoint chuyển sang user redis
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100

volumes:
  caddy_data:
    name: nc_caddy_data
  caddy_config:
    name: nc_caddy_config

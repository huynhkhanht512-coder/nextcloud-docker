; =============================================================================
;  File cấu hình PHP – được BIND MOUNT (chỉ-đọc) vào container Nextcloud tại
;  /usr/local/etc/php/conf.d/zz-custom.ini  (tên "zz-" để được nạp sau cùng và ghi đè)
;
;  Sửa file này trên máy host rồi chạy:  docker compose restart app
;  Kiểm tra: docker compose exec app php -r 'echo ini_get("upload_max_filesize"), PHP_EOL;'
; =============================================================================
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600

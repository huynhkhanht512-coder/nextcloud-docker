# Prometheus – bind mount chỉ-đọc vào container nc_prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor              # số liệu của từng container
    static_configs:
      - targets: ["cadvisor:8080"]
